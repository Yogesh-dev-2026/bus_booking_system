{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Register</h2>
  <form method="post">
    <input name="name" placeholder="Full name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password (min 6)" required>
    <button>Register</button>
  </form>
</div>
{% endblock %}
