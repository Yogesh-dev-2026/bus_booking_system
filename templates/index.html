{% extends "base.html" %}
{% block content %}
<h1>Book your bus ticket</h1>
<form action="/search" method="get" class="card">
  <label>From</label>
  <input name="source" placeholder="Chennai" required>
  <label>To</label>
  <input name="destination" placeholder="Bangalore" required>
  <label>Date</label>
  <input type="date" name="travel_date" min="{{ today }}" required>
  <button>Search buses</button>
</form>
{% endblock %}
