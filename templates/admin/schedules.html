{% extends "base.html" %}
{% block content %}
<h2>Manage Schedules</h2>
<form method="post" class="card">
  <select name="bus_id" required>
    {% for b in buses %}
    <option value="{{ b.id }}">{{ b.name }} ({{ b.bus_type }})</option>
    {% endfor %}
  </select>
  <input name="source" placeholder="From" required>
  <input name="destination" placeholder="To" required>
  <input type="date" name="travel_date" required>
  <input type="time" name="departure_time" required>
  <input type="number" name="price" placeholder="Price per seat" min="1" step="0.01" required>
  <button>Add schedule</button>
</form>
<table>
  <tr><th>ID</th><th>Bus</th><th>Route</th><th>Date</th><th>Time</th><th>Price</th><th></th></tr>
  {% for s in schedules %}
  <tr>
    <td>{{ s.id }}</td>
    <td>{{ s.bus_name }}</td>
    <td>{{ s.source }} → {{ s.destination }}</td>
    <td>{{ s.travel_date }}</td>
    <td>{{ s.departure_time }}</td>
    <td>₹{{ s.price }}</td>
    <td><form method="post" action="/admin/schedules/{{ s.id }}/delete"><button>Delete</button></form></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
